# cargo deny check — licenses, sources and advisories of all dependencies.

[graph]
all-features = false

[advisories]
# See .cargo/audit.toml for why.
ignore = ["RUSTSEC-2026-0344", "RUSTSEC-2026-0192"]

[licenses]
# Permissive licenses only, so Tapetum can stay MIT.
allow = [
    "MIT", "MIT-0", "Apache-2.0", "Apache-2.0 WITH LLVM-exception", "BSD-2-Clause", "BSD-3-Clause",
    "ISC", "Zlib", "0BSD", "Unlicense", "CC0-1.0", "BSL-1.0", "Unicode-3.0", "OFL-1.1", "Ubuntu-font-1.0",
]
confidence-threshold = 0.9

[bans]
multiple-versions = "allow"
wildcards = "deny"
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
